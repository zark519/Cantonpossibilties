<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öténdimél</title>
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
      --text-main: #333333;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      padding-bottom: 80px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .btn:hover { opacity: 0.9; }
    .btn-danger { background-color: #dc3545; }
    .btn-success { background-color: #28a745; }
    .btn-secondary { background-color: #6c757d; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }

    .tab-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 30px;
      border: 2px solid var(--primary-color);
      background: white;
      color: var(--primary-color);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: white;
    }

    .chart-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .chart-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .chart-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      background: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chart-item:hover { background: #f1f3f5; }

    .chart-rank {
      font-size: 18px;
      font-weight: bold;
      width: 90px;
      color: #666;
      text-align: center;
      flex-shrink: 0;
    }

    .chart-info {
      flex-grow: 1;
      padding-left: 15px;
    }

    .song-title {
      color: #dc3545;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .artist-name {
      color: #000000;
      font-size: 14px;
    }

    .chart-score {
      font-size: 14px;
      color: #28a745;
      font-weight: bold;
      text-align: right;
    }

    .fab {
      position: fixed;
      right: 30px;
      bottom: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--primary-color);
      color: white;
      font-size: 32px;
      border: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 25px;
      width: 90%;
      max-width: 850px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 24px;
      cursor: pointer;
      color: #aaa;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input[type="text"], input[type="date"], select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border-color);
      border-radius: 4px; box-sizing: border-box; font-size: 14px;
    }

    .readonly-input {
      background-color: #e9ecef;
      cursor: not-allowed;
    }

    .weeks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .week-input-item {
      background: #f8f9fa;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .week-input-header {
      font-size: 12px;
      font-weight: bold;
      color: #555;
    }

    .week-input-body {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-input-body input {
      width: 60px;
      padding: 4px;
      text-align: center;
    }

    .week-stats {
      font-size: 11px;
      color: #666;
    }

    .song-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .song-table th, .song-table td {
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      text-align: left;
    }

    .song-table th { background: #e9ecef; }
  </style>
</head>
<body>

<div class="container">
  <h1>✨ Öténdimél 🎧</h1>

  <div class="top-actions">
    <button class="btn btn-success" onclick="exportToTXT()">📤 匯出榜單</button>
    <input type="file" id="importFile" accept=".txt" style="display:none;" onchange="importFromTXT(event)">
    <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 匯入榜單</button>
  </div>

  <div class="card">
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabWeekly" onclick="switchTab('weekly')">📅 每週排行榜</button>
      <button class="tab-btn" id="tabYearly" onclick="switchTab('yearly')">🏆 年度榜單</button>
      <button class="tab-btn" id="tabYearlyChampions" onclick="switchTab('yearlyChampions')">👑 冠軍歌</button>
      <button class="tab-btn" id="tabTotal" onclick="switchTab('total')">🌟 總榜單</button>
      <button class="tab-btn" id="tabSearch" onclick="switchTab('search')">🔍 歌手搜尋</button>
    </div>

    <!-- 週榜選擇器 -->
    <div id="weeklySelectorArea" class="form-group" style="max-width: 400px; margin: 0 auto 20px auto;">
      <label for="weekSelect">🗓️ 選擇週數：</label>
      <select id="weekSelect" onchange="renderWeeklyChart()"></select>
    </div>

    <!-- 年榜選擇器 -->
    <div id="yearlySelectorArea" class="form-group" style="max-width: 400px; margin: 0 auto 20px auto; display:none;">
      <label for="yearSelect">📅 選擇年份：</label>
      <select id="yearSelect" onchange="updateYearWeekOptions(); onYearSelectChange();"></select>
      
      <label for="yearWeekSelect" style="margin-top: 10px;">📊 選擇週數範圍：</label>
      <select id="yearWeekSelect" onchange="onYearSelectChange()"></select>
    </div>

    <!-- 年榜冠軍歌專用選擇器 -->
    <div id="yearlyChampionsSelectorArea" class="form-group" style="max-width: 400px; margin: 0 auto 20px auto; display:none;">
      <label for="champYearSelect">📅 選擇年份：</label>
      <select id="champYearSelect" onchange="renderYearlyChampionsChart()"></select>
    </div>

    <!-- 歌手搜尋 -->
    <div id="searchSelectorArea" class="form-group" style="max-width: 400px; margin: 0 auto 20px auto; display:none;">
      <label for="artistSearchInput">🎤 搜尋歌手名稱：</label>
      <input type="text" id="artistSearchInput" placeholder="輸入歌手名字..." oninput="renderArtistSearch()">
    </div>

    <div class="chart-header">
      <h2 id="chartTitle">每週排行榜</h2>
      <p id="chartSubTitle" style="color:#666;"></p>
    </div>

    <ul class="chart-list" id="chartDisplay"></ul>
  </div>

  <div class="card">
    <h3>📜 已登記歌曲管理</h3>
    <table class="song-table">
      <thead>
        <tr>
          <th>🎵 歌曲與歌手</th>
          <th>📅 進榜與累積週數</th>
          <th style="width: 110px;">⚙️ 操作</th>
        </tr>
      </thead>
      <tbody id="songTableBody"></tbody>
    </table>
  </div>
</div>

<button class="fab" onclick="openSongModal()" title="新增歌曲">+</button>

<div class="modal" id="songModal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeSongModal()">&times;</span>
    <h3 id="formTitle">➕ 輸入/編輯歌曲資料</h3>
    <form id="songForm">
      <input type="hidden" id="editSongId">
      
      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">
        <div class="form-group" style="flex: 1; min-width: 180px; margin-bottom: 0;">
          <label for="songTitle">🎵 歌曲名稱：</label>
          <input type="text" id="songTitle" required placeholder="例如：再見美瑛">
        </div>
        <div class="form-group" style="flex: 1; min-width: 180px; margin-bottom: 0;">
          <label for="artistName">🎤 歌手名稱：</label>
          <input type="text" id="artistName" required placeholder="例如：馬曼清">
        </div>
        <div class="form-group" style="flex: 1; min-width: 180px; margin-bottom: 0;">
          <label for="releaseDate">📅 派台/發行日期：</label>
          <input type="date" id="releaseDate" required onchange="autoCalculateChartWeeks()">
        </div>
      </div>

      <!-- 自動推算進榜週 -->
      <div class="form-group" style="margin-bottom: 12px;">
        <label for="chartWeek">🚩 進榜週：</label>
        <input type="text" id="chartWeek" class="readonly-input" readonly placeholder="選取派台日期後自動計算">
      </div>

      <label style="margin-top: 10px; display: block;">📊 排名：</label>
      <div class="weeks-grid" id="weeksInputs"></div>

      <div style="text-align: right; margin-top: 15px;">
        <button type="button" class="btn btn-secondary" onclick="closeSongModal()">取消</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">💾 儲存歌曲榜單</button>
      </div>
    </form>
  </div>
</div>

<script>
  let songs = JSON.parse(localStorage.getItem('chart_songs') || '[]');
  let currentTab = 'weekly';

  const BASE_POINTS = [
    { rank: 1,  pts: 290 }, { rank: 2,  pts: 270 }, { rank: 3,  pts: 254 },
    { rank: 5,  pts: 230 }, { rank: 10, pts: 180 }, { rank: 15, pts: 150 },
    { rank: 20, pts: 125 }, { rank: 25, pts: 100 }, { rank: 30, pts: 80  },
    { rank: 35, pts: 60  }, { rank: 40, pts: 45  }, { rank: 45, pts: 30  },
    { rank: 50, pts: 20  }
  ];

  function calculateBasePoints(rank) {
    if (!rank || rank < 1 || rank > 50) return 0;
    const exact = BASE_POINTS.find(p => p.rank === rank);
    if (exact) return exact.pts;

    for (let i = 0; i < BASE_POINTS.length - 1; i++) {
      let p1 = BASE_POINTS[i];
      let p2 = BASE_POINTS[i+1];
      if (rank > p1.rank && rank < p2.rank) {
        let slope = (p2.pts - p1.pts) / (p2.rank - p1.rank);
        return p1.pts + slope * (rank - p1.rank);
      }
    }
    return 0;
  }

  // 完美修正版：精準計算週數與年份標籤
  function getWeekDetails(dateObj) {
    let inputDate = new Date(dateObj);
    inputDate.setHours(0,0,0,0);
    
    let dayOfWeek = inputDate.getDay(); // 0:日, 1:一, 2:二, 3:三, 4:四, 5:五, 6:六

    // 1. 判斷進榜起始週 (星期四至星期日發行，歸入下一週榜單)
    let chartSunDate = new Date(inputDate);
    if (dayOfWeek >= 4 || dayOfWeek === 0) {
      let daysToAdd = (dayOfWeek === 0) ? 7 : (7 - dayOfWeek);
      chartSunDate.setDate(chartSunDate.getDate() + daysToAdd);
    } else {
      chartSunDate.setDate(chartSunDate.getDate() - dayOfWeek);
    }
    chartSunDate.setHours(0,0,0,0);

    let chartSatDate = new Date(chartSunDate);
    chartSatDate.setDate(chartSunDate.getDate() + 6);

    // 2. 以該週的中間點（星期三）判定所屬年份
    let wednesday = new Date(chartSunDate);
    wednesday.setDate(chartSunDate.getDate() + 3);
    let targetYear = wednesday.getFullYear();

    // 3. 找出該 targetYear 的「第 1 週星期日」（包含 1/4 的那一週）
    let jan4 = new Date(targetYear, 0, 4);
    let yearW1Sun = new Date(jan4);
    yearW1Sun.setDate(jan4.getDate() - jan4.getDay());
    yearW1Sun.setHours(0,0,0,0);

    // 4. 計算與第 1 週相差幾週
    let diffMs = chartSunDate.getTime() - yearW1Sun.getTime();
    let diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));
    let weekNum = Math.floor(diffDays / 7) + 1;

    const formatDate = (d) => {
      let mm = String(d.getMonth() + 1).padStart(2, '0');
      let dd = String(d.getDate()).padStart(2, '0');
      let yyyy = d.getFullYear();
      return `${mm}/${dd}/${yyyy}`;
    };

    const weekLabel = `${targetYear}年 第${weekNum}週 (${formatDate(chartSunDate)} - ${formatDate(chartSatDate)})`;
    const weekKey = `${targetYear}_W${String(weekNum).padStart(2, '0')}`;

    return { year: targetYear, weekNum, weekLabel, weekKey, startDate: chartSunDate, endDate: chartSatDate };
  }

  function autoCalculateChartWeeks() {
    const val = document.getElementById('releaseDate').value;
    if (!val) return;

    const parts = val.split('-');
    const relDate = new Date(parts[0], parts[1] - 1, parts[2]);
    const weekInfo = getWeekDetails(relDate);
    document.getElementById('chartWeek').value = weekInfo.weekLabel;
  }

  window.onload = function() {
    recalculateAllActualRanks();
    saveSongs();
    updateSongTable();
    updateWeekSelectOptions();
    renderWeeklyChart();
  };

  function openSongModal() { document.getElementById('songModal').style.display = 'flex'; }
  function closeSongModal() { document.getElementById('songModal').style.display = 'none'; resetForm(); }

  function init40WeeksInputs(editingSong = null) {
    const container = document.getElementById('weeksInputs');
    container.innerHTML = '';

    for (let i = 1; i <= 40; i++) {
      let existingData = editingSong ? editingSong.weeklyData.find(w => w.weekIndex === i) : null;
      let rankVal = existingData ? existingData.inputRank : '';
      let ptsVal = existingData ? existingData.points : '-';
      let actualRankVal = existingData && existingData.actualRank ? `#${existingData.actualRank}` : '-';

      container.innerHTML += `
        <div class="week-input-item">
          <div class="week-input-header">第 ${i} 週</div>
          <div class="week-input-body">
            <input type="number" min="1" max="50" class="rank-input" data-week="${i}" value="${rankVal}" placeholder="1-50" onchange="updateScorePreview(${i})">
            <div class="week-stats">
              <div>點數: <strong id="scorePreview_${i}" style="color:#28a745;">${ptsVal}</strong></div>
              <div>實際排名: <strong id="actualRankPreview_${i}" style="color:#007bff;">${actualRankVal}</strong></div>
            </div>
          </div>
        </div>
      `;
    }
  }

  function updateScorePreview(weekNum) {
    const input = document.querySelector(`.rank-input[data-week="${weekNum}"]`);
    const badge = document.getElementById(`scorePreview_${weekNum}`);
    const val = parseInt(input.value);
    if (val >= 1 && val <= 50) {
      let base = calculateBasePoints(val);
      badge.textContent = `${base.toFixed(1)}點`;
    } else {
      badge.textContent = '-';
    }
  }

  function autoInterpolateRanks(rawRanks) {
    let result = [...rawRanks];
    let filledIndices = [];

    for (let i = 0; i < result.length; i++) {
      if (result[i] !== null && !isNaN(result[i])) filledIndices.push(i);
    }

    if (filledIndices.length < 2) return result;

    for (let k = 0; k < filledIndices.length - 1; k++) {
      let startIndex = filledIndices[k];
      let endIndex = filledIndices[k + 1];
      let startVal = result[startIndex];
      let endVal = result[endIndex];
      let steps = endIndex - startIndex;
      let diff = endVal - startVal;

      for (let j = 1; j < steps; j++) {
        let interpolatedVal = startVal + (diff / steps) * j;
        let rounded = Math.round(interpolatedVal);
        result[startIndex + j] = Math.max(1, Math.min(50, rounded));
      }
    }
    return result;
  }

  document.getElementById('songForm').onsubmit = function(e) {
    e.preventDefault();

    const title = document.getElementById('songTitle').value.trim();
    const artist = document.getElementById('artistName').value.trim();
    const releaseDateVal = document.getElementById('releaseDate').value;
    const chartWeek = document.getElementById('chartWeek').value.trim();
    const editId = document.getElementById('editSongId').value;

    if (!title || !artist || !releaseDateVal) return;

    const inputs = document.querySelectorAll('.rank-input');
    let rawRanks = [];
    inputs.forEach(input => {
      let val = parseInt(input.value);
      rawRanks.push((val >= 1 && val <= 50) ? val : null);
    });

    let finalRanks = autoInterpolateRanks(rawRanks);

    const parts = releaseDateVal.split('-');
    let baseDate = new Date(parts[0], parts[1] - 1, parts[2]);
    let startWeekInfo = getWeekDetails(baseDate);

    let weeklyData = [];
    let currentSun = new Date(startWeekInfo.startDate);

    let existingSong = songs.find(s => s.id === editId);

    for (let i = 0; i < finalRanks.length; i++) {
      if (finalRanks[i] !== null) {
        let rank = finalRanks[i];
        let basePts = calculateBasePoints(rank);

        let existingWeek = existingSong ? existingSong.weeklyData.find(w => w.weekIndex === (i + 1)) : null;
        let randomOffset = existingWeek && existingWeek.randomOffset !== undefined 
          ? existingWeek.randomOffset 
          : (Math.random() * 10 - 5);

        let finalPoints = Math.round((basePts + randomOffset) * 10) / 10;
        let weekInfo = getWeekDetails(currentSun);

        weeklyData.push({
          weekIndex: i + 1,
          inputRank: rank,
          basePoints: basePts,
          randomOffset: Math.round(randomOffset * 10) / 10,
          points: finalPoints,
          weekKey: weekInfo.weekKey,
          weekLabel: weekInfo.weekLabel,
          year: weekInfo.year,
          weekNum: weekInfo.weekNum,
          actualRank: null
        });
      }
      currentSun.setDate(currentSun.getDate() + 7);
    }

    const songObj = {
      id: editId ? editId : Date.now().toString(),
      title, artist, entryDate: releaseDateVal,
      startWeekKey: startWeekInfo.weekKey,
      startWeekLabel: chartWeek,
      weeklyData
    };

    if (editId) {
      songs = songs.map(s => s.id === editId ? songObj : s);
    } else {
      songs.push(songObj);
    }

    recalculateAllActualRanks();
    saveSongs();
    closeSongModal();
    updateSongTable();
    updateWeekSelectOptions();
    renderCurrentTab();
  };

  function recalculateAllActualRanks() {
    let weekKeys = new Set();
    
    songs.forEach(s => {
      if (!s.entryDate) return;
      const parts = s.entryDate.split('-');
      let baseDate = new Date(parts[0], parts[1] - 1, parts[2]);
      
      let startWeekInfo = getWeekDetails(baseDate);
      s.startWeekKey = startWeekInfo.weekKey;
      s.startWeekLabel = startWeekInfo.weekLabel;

      let currentSun = new Date(startWeekInfo.startDate);
      s.weeklyData.forEach(w => {
        let weekInfo = getWeekDetails(currentSun);
        w.weekKey = weekInfo.weekKey;
        w.weekLabel = weekInfo.weekLabel;
        w.year = weekInfo.year;
        w.weekNum = weekInfo.weekNum;
        
        weekKeys.add(w.weekKey);
        currentSun.setDate(currentSun.getDate() + 7);
      });
    });

    weekKeys.forEach(wKey => {
      let weekEntries = [];
      songs.forEach(s => {
        let w = s.weeklyData.find(item => item.weekKey === wKey);
        if (w) weekEntries.push({ song: s, weekData: w, points: w.points, entryDate: new Date(s.entryDate) });
      });

      weekEntries.sort((a, b) => b.points !== a.points ? b.points - a.points : b.entryDate - a.entryDate);
      weekEntries.forEach((entry, idx) => entry.weekData.actualRank = idx + 1);
    });
  }

  function saveSongs() { localStorage.setItem('chart_songs', JSON.stringify(songs)); }

  function resetForm() {
    document.getElementById('songForm').reset();
    document.getElementById('editSongId').value = '';
    document.getElementById('formTitle').textContent = '➕ 輸入/編輯歌曲資料';
    document.getElementById('saveBtn').textContent = '💾 儲存歌曲榜單';
    document.getElementById('chartWeek').value = '';
    init40WeeksInputs();
  }

  function editSong(id) {
    const song = songs.find(s => s.id === id);
    if (!song) return;

    document.getElementById('editSongId').value = song.id;
    document.getElementById('songTitle').value = song.title;
    document.getElementById('artistName').value = song.artist;
    document.getElementById('releaseDate').value = song.entryDate;

    document.getElementById('formTitle').textContent = '✏️ 編輯歌曲資料';
    document.getElementById('saveBtn').textContent = '💾 更新歌曲榜單';

    autoCalculateChartWeeks();
    init40WeeksInputs(song);
    openSongModal();
  }

  function deleteSong(id) {
    if (confirm('確定要刪除這首歌嗎？')) {
      songs = songs.filter(s => s.id !== id);
      recalculateAllActualRanks();
      saveSongs();
      updateSongTable();
      updateWeekSelectOptions();
      renderCurrentTab();
    }
  }

  function updateSongTable() {
    const tbody = document.getElementById('songTableBody');
    tbody.innerHTML = '';
    songs.forEach(song => {
      tbody.innerHTML += `
        <tr>
          <td>
            <div class="song-title" style="cursor:pointer;" onclick="editSong('${song.id}')">${song.title}</div>
            <div class="artist-name">${song.artist}</div>
          </td>
          <td>
            <div style="font-size:13px; font-weight:bold; color:#007bff;">${song.startWeekLabel}</div>
            <div style="font-size:12px; color:#666; margin-top:2px;">在榜 ${song.weeklyData.length} 週</div>
          </td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="editSong('${song.id}')">✏️ 編輯</button>
            <button class="btn btn-danger btn-sm" onclick="deleteSong('${song.id}')">🗑️ 刪除</button>
          </td>
        </tr>
      `;
    });
  }

  function updateWeekSelectOptions() {
    const weekSelect = document.getElementById('weekSelect');
    const yearSelect = document.getElementById('yearSelect');
    const champYearSelect = document.getElementById('champYearSelect');
    let weekMap = new Map();
    let years = new Set();

    years.add(new Date().getFullYear());

    songs.forEach(s => {
      s.weeklyData.forEach(w => {
        weekMap.set(w.weekKey, w.weekLabel);
        years.add(w.year);
      });
    });

    const sortedWeeks = Array.from(weekMap.keys()).sort().reverse();
    weekSelect.innerHTML = '';
    sortedWeeks.forEach(key => weekSelect.innerHTML += `<option value="${key}">${weekMap.get(key)}</option>`);

    const sortedYears = Array.from(years).sort().reverse();
    yearSelect.innerHTML = '';
    champYearSelect.innerHTML = '';
    sortedYears.forEach(y => {
      yearSelect.innerHTML += `<option value="${y}">${y} 年</option>`;
      champYearSelect.innerHTML += `<option value="${y}">${y} 年</option>`;
    });

    updateYearWeekOptions();
  }

  function updateYearWeekOptions() {
    const yearSelect = document.getElementById('yearSelect');
    const yearWeekSelect = document.getElementById('yearWeekSelect');
    const selectedYear = parseInt(yearSelect.value);

    yearWeekSelect.innerHTML = '<option value="all">全年度累計</option>';
    if (!selectedYear) return;

    let weekSet = new Set();
    songs.forEach(s => {
      s.weeklyData.forEach(w => {
        if (w.year === selectedYear) {
          let match = w.weekLabel.match(/第\d+週/);
          let label = match ? `第 ${w.weekKey.split('_W')[1]} 週` : w.weekKey;
          weekSet.add(JSON.stringify({ key: w.weekKey, label: label }));
        }
      });
    });

    let sortedWeeks = Array.from(weekSet).map(s => JSON.parse(s)).sort((a,b) => a.key.localeCompare(b.key));
    sortedWeeks.forEach(w => {
      yearWeekSelect.innerHTML += `<option value="${w.key}">${w.label}</option>`;
    });
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

    document.getElementById('weeklySelectorArea').style.display = (tab === 'weekly') ? 'block' : 'none';
    document.getElementById('yearlySelectorArea').style.display = (tab === 'yearly') ? 'block' : 'none';
    document.getElementById('yearlyChampionsSelectorArea').style.display = (tab === 'yearlyChampions') ? 'block' : 'none';
    document.getElementById('searchSelectorArea').style.display = (tab === 'search') ? 'block' : 'none';

    if (tab === 'weekly') {
      document.getElementById('tabWeekly').classList.add('active');
      document.getElementById('chartTitle').textContent = '每週排行榜';
      renderWeeklyChart();
    } else if (tab === 'yearly') {
      document.getElementById('tabYearly').classList.add('active');
      document.getElementById('chartTitle').textContent = '年度榜單';
      renderYearlyChart();
    } else if (tab === 'yearlyChampions') {
      document.getElementById('tabYearlyChampions').classList.add('active');
      document.getElementById('chartTitle').textContent = '冠軍歌';
      renderYearlyChampionsChart();
    } else if (tab === 'total') {
      document.getElementById('tabTotal').classList.add('active');
      document.getElementById('chartTitle').textContent = '總榜單';
      renderTotalChart();
    } else if (tab === 'search') {
      document.getElementById('tabSearch').classList.add('active');
      document.getElementById('chartTitle').textContent = '歌手歌曲搜尋';
      renderArtistSearch();
    }
  }

  function onYearSelectChange() {
    if (currentTab === 'yearly') renderYearlyChart();
  }

  function renderCurrentTab() { switchTab(currentTab); }

  function renderWeeklyChart() {
    const selectedWeekKey = document.getElementById('weekSelect').value;
    const displayContainer = document.getElementById('chartDisplay');
    displayContainer.innerHTML = '';

    if (!selectedWeekKey) {
      document.getElementById('chartSubTitle').textContent = '暫無週榜資料';
      return;
    }

    const weekText = document.getElementById('weekSelect').options[document.getElementById('weekSelect').selectedIndex]?.text;
    document.getElementById('chartSubTitle').textContent = weekText || '';

    let weekList = [];
    songs.forEach(song => {
      let match = song.weeklyData.find(w => w.weekKey === selectedWeekKey);
      if (match) weekList.push({ songId: song.id, title: song.title, artist: song.artist, entryDate: new Date(song.entryDate), inputRank: match.inputRank, points: match.points, actualRank: match.actualRank });
    });

    weekList.sort((a, b) => b.points !== a.points ? b.points - a.points : b.entryDate - a.entryDate);

    for (let r = 1; r <= 50; r++) {
      let item = weekList[r - 1];
      if (item) {
        displayContainer.innerHTML += `
          <li class="chart-item" onclick="editSong('${item.songId}')">
            <div class="chart-rank">#${r}</div>
            <div class="chart-info">
              <div class="song-title">${item.title}</div>
              <div class="artist-name">${item.artist} <small style="color:#888;">(當週排名:#${item.inputRank})</small></div>
            </div>
            <div class="chart-score">${item.points} 點</div>
          </li>
        `;
      } else {
        displayContainer.innerHTML += `
          <li class="chart-item" style="opacity: 0.3; cursor:default;">
            <div class="chart-rank">#${r}</div>
            <div class="chart-info">
              <div class="song-title" style="color:#aaa;">--- 虛位以待 ---</div>
              <div class="artist-name" style="color:#aaa;">---</div>
            </div>
            <div class="chart-score">-</div>
          </li>
        `;
      }
    }
  }

  function renderYearlyChart() {
    const selectedYear = parseInt(document.getElementById('yearSelect').value);
    const selectedWeekKey = document.getElementById('yearWeekSelect').value;
    const displayContainer = document.getElementById('chartDisplay');
    displayContainer.innerHTML = '';

    if (!selectedYear) {
      document.getElementById('chartSubTitle').textContent = '暫無年份資料';
      return;
    }

    let weekText = selectedWeekKey === 'all' ? '全年度累計' : document.getElementById('yearWeekSelect').options[document.getElementById('yearWeekSelect').selectedIndex]?.text;
    document.getElementById('chartSubTitle').textContent = `${selectedYear} 年度 (${weekText}) 累計點數排名`;

    let songScores = [];
    songs.forEach(song => {
      let totalPts = 0, weeksCount = 0;
      song.weeklyData.forEach(w => {
        if (w.year === selectedYear) {
          if (selectedWeekKey === 'all' || w.weekKey === selectedWeekKey) {
            totalPts += w.points;
            weeksCount++;
          }
        }
      });
      if (totalPts > 0) songScores.push({ songId: song.id, title: song.title, artist: song.artist, score: Math.round(totalPts * 10) / 10, weeks: weeksCount, entryDate: new Date(song.entryDate) });
    });

    songScores.sort((a, b) => b.score !== a.score ? b.score - a.score : b.entryDate - a.entryDate);

    if (songScores.length === 0) {
      displayContainer.innerHTML = '<li class="chart-item">該年份暫無數據</li>';
      return;
    }

    songScores.forEach((item, index) => {
      displayContainer.innerHTML += `
        <li class="chart-item" onclick="editSong('${item.songId}')">
          <div class="chart-rank">#${index + 1}</div>
          <div class="chart-info">
            <div class="song-title">${item.title}</div>
            <div class="artist-name">${item.artist} (${item.weeks} 週在榜)</div>
          </div>
          <div class="chart-score">${item.score} 點</div>
        </li>
      `;
    });
  }

  function renderYearlyChampionsChart() {
    const selectedYear = parseInt(document.getElementById('champYearSelect').value);
    const displayContainer = document.getElementById('chartDisplay');
    displayContainer.innerHTML = '';

    if (!selectedYear) {
      document.getElementById('chartSubTitle').textContent = '請選擇年份';
      return;
    }

    document.getElementById('chartSubTitle').textContent = `${selectedYear} 年各週冠軍歌曲一覽表`;

    let maxWeekNum = 52;
    songs.forEach(s => {
      s.weeklyData.forEach(w => {
        if (w.year === selectedYear && w.weekNum > maxWeekNum) {
          maxWeekNum = w.weekNum;
        }
      });
    });

    for (let week = 1; week <= maxWeekNum; week++) {
      let weekKeyStr = `${selectedYear}_W${String(week).padStart(2, '0')}`;
      
      let champSong = null;
      let champWeekData = null;

      songs.forEach(song => {
        let w = song.weeklyData.find(item => item.weekKey === weekKeyStr && item.actualRank === 1);
        if (w) {
          champSong = song;
          champWeekData = w;
        }
      });

      if (champSong) {
        displayContainer.innerHTML += `
          <li class="chart-item" onclick="editSong('${champSong.id}')">
            <div class="chart-rank" style="color:#d9534f;">第 ${week} 週</div>
            <div class="chart-info">
              <div class="song-title">👑 ${champSong.title}</div>
              <div class="artist-name">${champSong.artist}</div>
            </div>
            <div class="chart-score">${champWeekData.points} 點</div>
          </li>
        `;
      } else {
        displayContainer.innerHTML += `
          <li class="chart-item" style="opacity: 0.4; cursor:default;">
            <div class="chart-rank">第 ${week} 週</div>
            <div class="chart-info">
              <div class="song-title" style="color:#999;">--- 暫無冠軍資料 ---</div>
              <div class="artist-name" style="color:#aaa;">---</div>
            </div>
            <div class="chart-score">-</div>
          </li>
        `;
      }
    }
  }

  function renderTotalChart() {
    const displayContainer = document.getElementById('chartDisplay');
    displayContainer.innerHTML = '';
    document.getElementById('chartSubTitle').textContent = '歷史所有星期總點數累計排名';

    let songScores = [];
    songs.forEach(song => {
      let totalPts = song.weeklyData.reduce((sum, w) => sum + w.points, 0);
      if (totalPts > 0) songScores.push({ songId: song.id, title: song.title, artist: song.artist, score: Math.round(totalPts * 10) / 10, weeks: song.weeklyData.length, entryDate: new Date(song.entryDate) });
    });

    songScores.sort((a, b) => b.score !== a.score ? b.score - a.score : b.entryDate - a.entryDate);

    if (songScores.length === 0) {
      displayContainer.innerHTML = '<li class="chart-item">暫無累積數據</li>';
      return;
    }

    songScores.forEach((item, index) => {
      displayContainer.innerHTML += `
        <li class="chart-item" onclick="editSong('${item.songId}')">
          <div class="chart-rank">#${index + 1}</div>
          <div class="chart-info">
            <div class="song-title">${item.title}</div>
            <div class="artist-name">${item.artist} (共 ${item.weeks} 週)</div>
          </div>
          <div class="chart-score">${item.score} 點</div>
        </li>
      `;
    });
  }

  function renderArtistSearch() {
    const keyword = document.getElementById('artistSearchInput').value.trim().toLowerCase();
    const displayContainer = document.getElementById('chartDisplay');
    displayContainer.innerHTML = '';

    if (!keyword) {
      document.getElementById('chartSubTitle').textContent = '請在上方輸入歌手名稱進行搜尋';
      return;
    }

    const matchedSongs = songs.filter(s => s.artist.toLowerCase().includes(keyword));
    document.getElementById('chartSubTitle').textContent = `共搜尋到 ${matchedSongs.length} 首關於「${keyword}」的歌曲`;

    if (matchedSongs.length === 0) {
      displayContainer.innerHTML = '<li class="chart-item" style="justify-content:center; color:#999;">未找到相關歌手的歌曲</li>';
      return;
    }

    matchedSongs.sort((a, b) => {
      let ptsA = a.weeklyData.reduce((sum, w) => sum + w.points, 0);
      let ptsB = b.weeklyData.reduce((sum, w) => sum + w.points, 0);
      return ptsB - ptsA;
    });

    matchedSongs.forEach((song, idx) => {
      let totalPts = Math.round(song.weeklyData.reduce((sum, w) => sum + w.points, 0) * 10) / 10;
      displayContainer.innerHTML += `
        <li class="chart-item" onclick="editSong('${song.id}')">
          <div class="chart-rank">#${idx + 1}</div>
          <div class="chart-info">
            <div class="song-title">${song.title}</div>
            <div class="artist-name">${song.artist} (在榜 ${song.weeklyData.length} 週)</div>
          </div>
          <div class="chart-score">總點數: ${totalPts} 點</div>
        </li>
      `;
    });
  }

  function exportToTXT() {
    if (songs.length === 0) { alert('現時沒有任何歌曲資料可導出！'); return; }

    let txtContent = "=========================================\n       Öténdimél 資料備份 (TXT)\n=========================================\n\n";
    songs.forEach((s, idx) => {
      txtContent += `${idx + 1}. 歌曲：${s.title} | 歌手：${s.artist}\n   派台日期：${s.entryDate} (${s.startWeekLabel})\n   週排名紀錄：\n`;
      s.weeklyData.forEach(w => {
        txtContent += `     - [第${w.weekIndex}週] ${w.weekLabel} -> 輸入排名:${w.inputRank} | 點數:${w.points} | 實際排名:#${w.actualRank}\n`;
      });
      txtContent += "\n";
    });

    txtContent += "=========================================\nDATA_START\n";
    txtContent += btoa(encodeURIComponent(JSON.stringify(songs)));
    txtContent += "\nDATA_END\n";

    const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Otendimel_Backup_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importFromTXT(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const content = e.target.result;
        const startIndex = content.indexOf("DATA_START\n") + "DATA_START\n".length;
        const endIndex = content.indexOf("\nDATA_END");

        if (startIndex === -1 || endIndex === -1) throw new Error('找不到有效的系統數據標籤！');

        const base64Data = content.substring(startIndex, endIndex).trim();
        const jsonString = decodeURIComponent(atob(base64Data));
        const importedSongs = JSON.parse(jsonString);

        if (Array.isArray(importedSongs)) {
          if (confirm(`成功讀取 TXT 數據！是否合併至現有榜單中？\n（確定將合併資料，取消則取消匯入）`)) {
            const songMap = new Map();
            songs.forEach(s => songMap.set(s.id, s));
            importedSongs.forEach(s => songMap.set(s.id, s));

            songs = Array.from(songMap.values());
            recalculateAllActualRanks();
            saveSongs();
            updateSongTable();
            updateWeekSelectOptions();
            renderCurrentTab();
            alert('資料匯入合併成功！');
          }
        } else {
          throw new Error('數據格式不正確！');
        }
      } catch (err) {
        alert('匯入失敗：' + err.message);
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }
</script>
