<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音樂榜單管理系統 (Music Chart Tracker)</title>
  <style>
    :root {
      --primary-color: #d9534f;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
      --text-main: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      padding-bottom: 80px; /* 給浮動按鈕留空間 */
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover { opacity: 0.9; }
    .btn-danger { background-color: #dc3545; }
    .btn-success { background-color: #28a745; }
    .btn-secondary { background-color: #6c757d; }

    /* 榜單切換按鈕區域 */
    .tab-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 30px;
      border: 2px solid #007bff;
      background: white;
      color: #007bff;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #007bff;
      color: white;
    }

    /* 榜單 Display */
    .chart-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .chart-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .chart-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      background: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chart-item:hover {
      background: #f1f3f5;
    }

    .chart-rank {
      font-size: 20px;
      font-weight: bold;
      width: 45px;
      color: #666;
      text-align: center;
    }

    .chart-info {
      flex-grow: 1;
      padding-left: 15px;
    }

    .song-title {
      color: #dc3545; /* 歌曲名稱為紅色 */
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .artist-name {
      color: #000000; /* 歌手名稱為黑色 */
      font-size: 14px;
    }

    .chart-score {
      font-size: 14px;
      color: #28a745;
      font-weight: bold;
      text-align: right;
    }

    /* 右下角浮動加號按鈕 (FAB) */
    .fab {
      position: fixed;
      right: 30px;
      bottom: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #007bff;
      color: white;
      font-size: 32px;
      border: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99;
    }

    /* Modal 彈出視窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 25px;
      width: 90%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 24px;
      cursor: pointer;
      color: #aaa;
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], input[type="date"], select {
      width: 100%; padding: 10px; border: 1px solid var(--border-color);
      border-radius: 4px; box-sizing: border-box; font-size: 14px;
    }

    /* 40周排名輸入表格 */
    .weeks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .week-input-item {
      background: #f8f9fa;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .week-input-header {
      font-size: 12px;
      font-weight: bold;
      color: #555;
    }

    .week-input-body {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-input-body input {
      width: 60px;
      padding: 4px;
      text-align: center;
    }

    .week-stats {
      font-size: 11px;
      color: #666;
    }

    .song-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .song-table th, .song-table td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }

    .song-table th { background: #e9ecef; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎵 音樂榜單 Dashboard</h1>

  <!-- 頂部 Export & Import 區域 -->
  <div class="top-actions">
    <button class="btn btn-success" onclick="exportToTXT()">📤 Export TXT</button>
    <input type="file" id="importFile" accept=".txt" style="display:none;" onchange="importFromTXT(event)">
    <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 Import TXT</button>
  </div>

  <!-- Dashboard 榜單展示區域 -->
  <div class="card">
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabWeekly" onclick="switchTab('weekly')">📅 週榜單 (Top 50)</button>
      <button class="tab-btn" id="tabYearly" onclick="switchTab('yearly')">🏆 年榜單</button>
      <button class="tab-btn" id="tabTotal" onclick="switchTab('total')">👑 總累積榜單</button>
    </div>

    <!-- 週榜選擇器 -->
    <div id="weeklySelectorArea" class="form-group" style="max-width: 400px; margin: 0 auto 20px auto;">
      <label for="weekSelect">選擇週數：</label>
      <select id="weekSelect" onchange="renderWeeklyChart()"></select>
    </div>

    <!-- 年榜選擇器 -->
    <div id="yearlySelectorArea" class="form-group" style="max-width: 400px; margin: 0 auto 20px auto; display:none;">
      <label for="yearSelect">選擇年份：</label>
      <select id="yearSelect" onchange="renderYearlyChart()"></select>
    </div>

    <div class="chart-header">
      <h2 id="chartTitle">週榜單 (Top 50)</h2>
      <p id="chartSubTitle" style="color:#666;"></p>
    </div>

    <ul class="chart-list" id="chartDisplay">
      <!-- 榜單匹配內容 -->
    </ul>
  </div>

  <!-- 已登記歌曲列表 -->
  <div class="card">
    <h3>📜 已登記歌曲管理</h3>
    <table class="song-table">
      <thead>
        <tr>
          <th>歌曲</th>
          <th>歌手</th>
          <th>首個進榜週</th>
          <th>在榜週數</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="songTableBody"></tbody>
    </table>
  </div>
</div>

<!-- 右下角浮動加號按鈕 (FAB) -->
<button class="fab" onclick="openSongModal()" title="新增歌曲">+</button>

<!-- 歌曲編輯/錄入 Modal 彈窗 -->
<div class="modal" id="songModal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeSongModal()">&times;</span>
    <h3 id="formTitle">➕ 輸入/編輯歌曲資料</h3>
    <form id="songForm">
      <input type="hidden" id="editSongId">
      <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <div class="form-group" style="flex: 1; min-width: 200px;">
          <label for="songTitle">歌曲名稱：</label>
          <input type="text" id="songTitle" required placeholder="例如：海闊天空">
        </div>
        <div class="form-group" style="flex: 1; min-width: 200px;">
          <label for="artistName">歌手名稱：</label>
          <input type="text" id="artistName" required placeholder="例如：Beyond">
        </div>
        <div class="form-group" style="flex: 1; min-width: 200px;">
          <label for="entryDate">進榜日期：</label>
          <input type="date" id="entryDate" required onchange="calculateEntryWeek()">
        </div>
      </div>

      <p id="entryWeekNotice" style="color: #007bff; font-weight: bold; margin-top: -5px;"></p>

      <label>輸入連續 40 週排名（可留空自動拉 Curve）：</label>
      <div class="weeks-grid" id="weeksInputs"></div>

      <div style="text-align: right; margin-top: 15px;">
        <button type="button" class="btn btn-secondary" onclick="closeSongModal()">取消</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">儲存歌曲榜單</button>
      </div>
    </form>
  </div>
</div>

<script>
  let songs = JSON.parse(localStorage.getItem('chart_songs') || '[]');
  let currentTab = 'weekly';

  // 13 個排名基準點
  const BASE_POINTS = [
    { rank: 1,  pts: 290 },
    { rank: 2,  pts: 270 },
    { rank: 3,  pts: 254 },
    { rank: 5,  pts: 230 },
    { rank: 10, pts: 180 },
    { rank: 15, pts: 150 },
    { rank: 20, pts: 125 },
    { rank: 25, pts: 100 },
    { rank: 30, pts: 80  },
    { rank: 35, pts: 60  },
    { rank: 40, pts: 45  },
    { rank: 45, pts: 30  },
    { rank: 50, pts: 20  }
  ];

  // 分段線性拉 Curve 計算基礎分數
  function calculateBasePoints(rank) {
    if (!rank || rank < 1 || rank > 50) return 0;
    
    // 如果剛好匹配基準點
    const exact = BASE_POINTS.find(p => p.rank === rank);
    if (exact) return exact.pts;

    // 尋找上下區間
    for (let i = 0; i < BASE_POINTS.length - 1; i++) {
      let p1 = BASE_POINTS[i];
      let p2 = BASE_POINTS[i+1];
      if (rank > p1.rank && rank < p2.rank) {
        let slope = (p2.pts - p1.pts) / (p2.rank - p1.rank);
        return p1.pts + slope * (rank - p1.rank);
      }
    }
    return 0;
  }

  // 初始化
  window.onload = function() {
    updateSongTable();
    updateWeekSelectOptions();
    renderWeeklyChart();
  };

  function openSongModal() {
    document.getElementById('songModal').style.display = 'flex';
  }

  function closeSongModal() {
    document.getElementById('songModal').style.display = 'none';
    resetForm();
  }

  // 生成 40 行排名/分數/實際排名輸入框
  function init40WeeksInputs(editingSong = null) {
    const container = document.getElementById('weeksInputs');
    container.innerHTML = '';

    for (let i = 1; i <= 40; i++) {
      let existingData = editingSong ? editingSong.weeklyData.find(w => w.weekIndex === i) : null;
      let rankVal = existingData ? existingData.inputRank : '';
      let ptsVal = existingData ? existingData.points : '-';
      let actualRankVal = existingData && existingData.actualRank ? `#${existingData.actualRank}` : '-';

      container.innerHTML += `
        <div class="week-input-item">
          <div class="week-input-header">第 ${i} 週</div>
          <div class="week-input-body">
            <input type="number" min="1" max="50" class="rank-input" data-week="${i}" value="${rankVal}" placeholder="1-50" onchange="updateScorePreview(${i})">
            <div class="week-stats">
              <div>點數: <strong id="scorePreview_${i}" style="color:#28a745;">${ptsVal}</strong></div>
              <div>實際排名: <strong id="actualRankPreview_${i}" style="color:#007bff;">${actualRankVal}</strong></div>
            </div>
          </div>
        </div>
      `;
    }
  }

  function updateScorePreview(weekNum) {
    const input = document.querySelector(`.rank-input[data-week="${weekNum}"]`);
    const badge = document.getElementById(`scorePreview_${weekNum}`);
    const val = parseInt(input.value);
    if (val >= 1 && val <= 50) {
      let base = calculateBasePoints(val);
      badge.textContent = `${base.toFixed(1)}點`;
    } else {
      badge.textContent = '-';
    }
  }

  // 計算週細節 (週六為結算日，4日歸屬原則)
  function getWeekDetails(dateObj) {
    const date = new Date(dateObj);
    const day = date.getDay(); // 0: Sun, 1: Mon, ... 4: Thu, 5: Fri, 6: Sat

    if (day >= 4) {
      date.setDate(date.getDate() + (7 - day + 1));
    }

    const currentDay = date.getDay();
    const distToSat = (6 - currentDay + 7) % 7;
    const satDate = new Date(date);
    satDate.setDate(date.getDate() + distToSat);

    const sunDate = new Date(satDate);
    sunDate.setDate(satDate.getDate() - 6);

    let yearCounts = {};
    let tempDate = new Date(sunDate);

    for (let i = 0; i < 7; i++) {
      let y = tempDate.getFullYear();
      yearCounts[y] = (yearCounts[y] || 0) + 1;
      tempDate.setDate(tempDate.getDate() + 1);
    }

    let targetYear = Object.keys(yearCounts).find(y => yearCounts[y] >= 4) || satDate.getFullYear();
    let jan1 = new Date(targetYear, 0, 1);
    let days = Math.floor((satDate - jan1) / (24 * 60 * 60 * 1000));
    let weekNum = Math.ceil((days + jan1.getDay() + 1) / 7);

    const formatDate = (d) => {
      let mm = String(d.getMonth() + 1).padStart(2, '0');
      let dd = String(d.getDate()).padStart(2, '0');
      let yyyy = d.getFullYear();
      return `${mm}/${dd}/${yyyy}`;
    };

    const weekLabel = `${targetYear}年 第${weekNum}週 (${formatDate(sunDate)} - ${formatDate(satDate)})`;
    const weekKey = `${targetYear}_W${String(weekNum).padStart(2, '0')}`;

    return {
      year: parseInt(targetYear),
      weekNum: weekNum,
      weekLabel: weekLabel,
      weekKey: weekKey,
      satDate: satDate
    };
  }

  function calculateEntryWeek() {
    const val = document.getElementById('entryDate').value;
    if (!val) return;
    const weekInfo = getWeekDetails(new Date(val));
    document.getElementById('entryWeekNotice').textContent = `首個進榜星期：${weekInfo.weekLabel}`;
  }

  // 自動拉 Curve (Interpolation)
  function autoInterpolateRanks(rawRanks) {
    let result = [...rawRanks];
    let filledIndices = [];

    for (let i = 0; i < result.length; i++) {
      if (result[i] !== null && !isNaN(result[i])) {
        filledIndices.push(i);
      }
    }

    if (filledIndices.length < 2) return result;

    for (let k = 0; k < filledIndices.length - 1; k++) {
      let startIndex = filledIndices[k];
      let endIndex = filledIndices[k + 1];
      let startVal = result[startIndex];
      let endVal = result[endIndex];

      let steps = endIndex - startIndex;
      let diff = endVal - startVal;

      for (let j = 1; j < steps; j++) {
        let interpolatedVal = startVal + (diff / steps) * j;
        let rounded = Math.round(interpolatedVal);
        rounded = Math.max(1, Math.min(50, rounded));
        result[startIndex + j] = rounded;
      }
    }

    return result;
  }

  // 儲存歌曲表單
  document.getElementById('songForm').onsubmit = function(e) {
    e.preventDefault();

    const title = document.getElementById('songTitle').value.trim();
    const artist = document.getElementById('artistName').value.trim();
    const entryDateVal = document.getElementById('entryDate').value;
    const editId = document.getElementById('editSongId').value;

    if (!title || !artist || !entryDateVal) return;

    const inputs = document.querySelectorAll('.rank-input');
    let rawRanks = [];
    inputs.forEach(input => {
      let val = parseInt(input.value);
      rawRanks.push((val >= 1 && val <= 50) ? val : null);
    });

    let finalRanks = autoInterpolateRanks(rawRanks);
    let startWeekInfo = getWeekDetails(new Date(entryDateVal));
    let weeklyData = [];
    let currentSat = new Date(startWeekInfo.satDate);

    // 尋找現有歌曲以保留或產生微擾動 (Random Offset)
    let existingSong = songs.find(s => s.id === editId);

    for (let i = 0; i < finalRanks.length; i++) {
      if (finalRanks[i] !== null) {
        let rank = finalRanks[i];
        let basePts = calculateBasePoints(rank);

        // 產生 -5.0 到 +5.0 之間的隨機數
        let existingWeek = existingSong ? existingSong.weeklyData.find(w => w.weekIndex === (i + 1)) : null;
        let randomOffset = existingWeek && existingWeek.randomOffset !== undefined 
          ? existingWeek.randomOffset 
          : (Math.random() * 10 - 5);

        let finalPoints = Math.round((basePts + randomOffset) * 10) / 10;
        let weekInfo = getWeekDetails(currentSat);

        weeklyData.push({
          weekIndex: i + 1,
          inputRank: rank,
          basePoints: basePts,
          randomOffset: Math.round(randomOffset * 10) / 10,
          points: finalPoints,
          weekKey: weekInfo.weekKey,
          weekLabel: weekInfo.weekLabel,
          year: weekInfo.year,
          actualRank: null // 隨後計算全榜時更新
        });
      }
      currentSat.setDate(currentSat.getDate() + 7);
    }

    const songObj = {
      id: editId ? editId : Date.now().toString(),
      title: title,
      artist: artist,
      entryDate: entryDateVal,
      startWeekKey: startWeekInfo.weekKey,
      startWeekLabel: startWeekInfo.weekLabel,
      weeklyData: weeklyData
    };

    if (editId) {
      songs = songs.map(s => s.id === editId ? songObj : s);
    } else {
      songs.push(songObj);
    }

    // 更新全局所有星期的「實際排名」
    recalculateAllActualRanks();

    saveSongs();
    closeSongModal();
    updateSongTable();
    updateWeekSelectOptions();
    renderCurrentTab();
  };

  // 重新計算全榜所有星期的實際排名
  function recalculateAllActualRanks() {
    let weekKeys = new Set();
    songs.forEach(s => s.weeklyData.forEach(w => weekKeys.add(w.weekKey)));

    weekKeys.forEach(wKey => {
      let weekEntries = [];

      songs.forEach(s => {
        let w = s.weeklyData.find(item => item.weekKey === wKey);
        if (w) {
          weekEntries.push({
            song: s,
            weekData: w,
            points: w.points,
            entryDate: new Date(s.entryDate)
          });
        }
      });

      // 排序：分數高至低，同分則按進榜日期新至舊 (Date DESC)
      weekEntries.sort((a, b) => {
        if (b.points !== a.points) {
          return b.points - a.points;
        }
        return b.entryDate - a.entryDate;
      });

      // 寫回實際排名
      weekEntries.forEach((entry, idx) => {
        entry.weekData.actualRank = idx + 1;
      });
    });
  }

  function saveSongs() {
    localStorage.setItem('chart_songs', JSON.stringify(songs));
  }

  function resetForm() {
    document.getElementById('songForm').reset();
    document.getElementById('editSongId').value = '';
    document.getElementById('formTitle').textContent = '➕ 輸入/編輯歌曲資料';
    document.getElementById('saveBtn').textContent = '儲存歌曲榜單';
    document.getElementById('entryWeekNotice').textContent = '';
    init40WeeksInputs();
  }

  function editSong(id) {
    const song = songs.find(s => s.id === id);
    if (!song) return;

    document.getElementById('editSongId').value = song.id;
    document.getElementById('songTitle').value = song.title;
    document.getElementById('artistName').value = song.artist;
    document.getElementById('entryDate').value = song.entryDate;
    document.getElementById('formTitle').textContent = '✏️ 編輯歌曲資料';
    document.getElementById('saveBtn').textContent = '更新歌曲榜單';

    calculateEntryWeek();
    init40WeeksInputs(song);
    openSongModal();
  }

  function deleteSong(id) {
    if (confirm('確定要刪除這首歌嗎？')) {
      songs = songs.filter(s => s.id !== id);
      recalculateAllActualRanks();
      saveSongs();
      updateSongTable();
      updateWeekSelectOptions();
      renderCurrentTab();
    }
  }

  function updateSongTable() {
    const tbody = document.getElementById('songTableBody');
    tbody.innerHTML = '';
    songs.forEach(song => {
      tbody.innerHTML += `
        <tr>
          <td><strong style="color:#dc3545; cursor:pointer;" onclick="editSong('${song.id}')">${song.title}</strong></td>
          <td>${song.artist}</td>
          <td><small>${song.startWeekLabel}</small></td>
          <td>${song.weeklyData.length} 週</td>
          <td>
            <button class="btn btn-secondary" onclick="editSong('${song.id}')">編輯</button>
            <button class="btn btn-danger" onclick="deleteSong('${song.id}')">刪除</button>
          </td>
        </tr>
      `;
    });
  }

  function updateWeekSelectOptions() {
    const weekSelect = document.getElementById('weekSelect');
    const yearSelect = document.getElementById('yearSelect');

    let weekMap = new Map();
    let years = new Set();

    songs.forEach(s => {
      s.weeklyData.forEach(w => {
        weekMap.set(w.weekKey, w.weekLabel);
        years.add(w.year);
      });
    });

    const sortedWeeks = Array.from(weekMap.keys()).sort().reverse();
    weekSelect.innerHTML = '';
    sortedWeeks.forEach(key => {
      weekSelect.innerHTML += `<option value="${key}">${weekMap.get(key)}</option>`;
    });

    const sortedYears = Array.from(years).sort().reverse();
    yearSelect.innerHTML = '';
    sortedYears.forEach(y => {
      yearSelect.innerHTML += `<option value="${y}">${y} 年</option>`;
    });
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

    document.getElementById('weeklySelectorArea').style.display = (tab === 'weekly') ? 'block' : 'none';
    document.getElementById('yearlySelectorArea').style.display = (tab === 'yearly') ? 'block' : 'none';

    if (tab === 'weekly') {
      document.getElementById('tabWeekly').classList.add('active');
      document.getElementById('chartTitle').textContent = '週榜單 ( Top 50 點數排名)';
      renderWeeklyChart();
    } else if (tab === 'yearly') {
      document.getElementById('tabYearly').classList.add('active');
      document.getElementById('chartTitle').textContent = '年度總點數榜單';
      renderYearlyChart();
    } else if (tab === 'total') {
      document.getElementById('tabTotal').classList.add('active');
      document.getElementById('chartTitle').textContent = '歷史累積總點數榜單';
      renderTotalChart();
    }
  }

  function renderCurrentTab() {
    switchTab(currentTab);
  }

  // 1. 渲染週榜單 (高至低排名 + 同分按進榜日期新至舊)
  function renderWeeklyChart() {
    const selectedWeekKey = document.getElementById('weekSelect').value;
    const displayContainer = document.getElementById('chartDisplay');
    displayContainer.innerHTML = '';

    if (!selectedWeekKey) {
      document.getElementById('chartSubTitle').textContent = '暫無週榜資料';
      return;
    }

    const weekText = document.getElementById('weekSelect').options[document.getElementById('weekSelect').selectedIndex]?.text;
    document.getElementById('chartSubTitle').textContent = weekText || '';

    let weekList = [];

    songs.forEach(song => {
      let match = song.weeklyData.find(w => w.weekKey === selectedWeekKey);
      if (match) {
        weekList.push({
          songId: song.id,
          title: song.title,
          artist: song.artist,
          entryDate: new Date(song.entryDate),
          inputRank: match.inputRank,
          points: match.points,
          actualRank: match.actualRank
        });
      }
    });

    // 高至低排序；同分按進榜日期新至舊
    weekList.sort((a, b) => {
      if (b.points !== a.points) return b.points - a.points;
      return b.entryDate - a.entryDate;
    });

    for (let r = 1; r <= 50; r++) {
      let item = weekList[r - 1];
      if (item) {
        displayContainer.innerHTML += `
          <li class="chart-item" onclick="editSong('${item.songId}')">
            <div class="chart-rank">${r}</div>
            <div class="chart-info">
              <div class="song-title">${item.title}</div>
              <div class="artist-name">${item.artist} <small style="color:#888;">(輸入排名:#${item.inputRank})</small></div>
            </div>
            <div class="chart-score">${item.points} 點</div>
          </li>
        `;
      } else {
        displayContainer.innerHTML += `
          <li class="chart-item" style="opacity: 0.3; cursor:default;">
            <div class="chart-rank">${r}</div>
            <div class="chart-info">
              <div class="song-title" style="color:#aaa;">--- 虛位以待 ---</div>
              <div class="artist-name" style="color:#aaa;">---</div>
            </div>
            <div class="chart-score">-</div>
          </li>
        `;
      }
    }
  }

  // 2. 渲染年榜單
  function renderYearlyChart() {
    const selectedYear = parseInt(document.getElementById('yearSelect').value);
    const displayContainer = document.getElementById('chartDisplay');
    displayContainer.innerHTML = '';

    if (!selectedYear) {
      document.getElementById('chartSubTitle').textContent = '暫無年份資料';
      return;
    }

    document.getElementById('chartSubTitle').textContent = `${selectedYear} 年度累計點數排名`;

    let songScores = [];

    songs.forEach(song => {
      let totalPts = 0;
      let weeksCount = 0;

      song.weeklyData.forEach(w => {
        if (w.year === selectedYear) {
          totalPts += w.points;
          weeksCount++;
        }
      });

      if (totalPts > 0) {
        songScores.push({
          songId: song.id,
          title: song.title,
          artist: song.artist,
          score: Math.round(totalPts * 10) / 10,
          weeks: weeksCount,
          entryDate: new Date(song.entryDate)
        });
      }
    });

    songScores.sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return b.entryDate - a.entryDate;
    });

    if (songScores.length === 0) {
      displayContainer.innerHTML = '<li class="chart-item">該年份暫無數據</li>';
      return;
    }

    songScores.forEach((item, index) => {
      displayContainer.innerHTML += `
        <li class="chart-item" onclick="editSong('${item.songId}')">
          <div class="chart-rank">${index + 1}</div>
          <div class="chart-info">
            <div class="song-title">${item.title}</div>
            <div class="artist-name">${item.artist} (${item.weeks} 週在榜)</div>
          </div>
          <div class="chart-score">${item.score} 點</div>
        </li>
      `;
    });
  }

  // 3. 渲染總累積榜單
  function renderTotalChart() {
    const displayContainer = document.getElementById('chartDisplay');
    displayContainer.innerHTML = '';
    document.getElementById('chartSubTitle').textContent = '歷史所有星期總點數累計排名';

    let songScores = [];

    songs.forEach(song => {
      let totalPts = song.weeklyData.reduce((sum, w) => sum + w.points, 0);
      if (totalPts > 0) {
        songScores.push({
          songId: song.id,
          title: song.title,
          artist: song.artist,
          score: Math.round(totalPts * 10) / 10,
          weeks: song.weeklyData.length,
          entryDate: new Date(song.entryDate)
        });
      }
    });

    songScores.sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return b.entryDate - a.entryDate;
    });

    if (songScores.length === 0) {
      displayContainer.innerHTML = '<li class="chart-item">暫無累積數據</li>';
      return;
    }

    songScores.forEach((item, index) => {
      displayContainer.innerHTML += `
        <li class="chart-item" onclick="editSong('${item.songId}')">
          <div class="chart-rank">${index + 1}</div>
          <div class="chart-info">
            <div class="song-title">${item.title}</div>
            <div class="artist-name">${item.artist} (共 ${item.weeks} 週)</div>
          </div>
          <div class="chart-score">${item.score} 點</div>
        </li>
      `;
    });
  }

  // Export TXT
  function exportToTXT() {
    if (songs.length === 0) {
      alert('現時沒有任何歌曲資料可導出！');
      return;
    }

    let txtContent = "=========================================\n";
    txtContent += "       音樂榜單系統資料備份 (TXT)\n";
    txtContent += "=========================================\n\n";

    songs.forEach((s, idx) => {
      txtContent += `${idx + 1}. 歌曲：${s.title} | 歌手：${s.artist}\n`;
      txtContent += `   進榜日期：${s.entryDate} (${s.startWeekLabel})\n`;
      txtContent += `   週排名紀錄：\n`;
      s.weeklyData.forEach(w => {
        txtContent += `     - [第${w.weekIndex}週] ${w.weekLabel} -> 輸入排名:${w.inputRank} | 點數:${w.points} | 實際排名:#${w.actualRank}\n`;
      });
      txtContent += "\n";
    });

    txtContent += "=========================================\n";
    txtContent += "DATA_START\n";
    txtContent += btoa(encodeURIComponent(JSON.stringify(songs)));
    txtContent += "\nDATA_END\n";

    const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Chart_Backup_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // Import TXT
  function importFromTXT(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const content = e.target.result;
        const startIndex = content.indexOf("DATA_START\n") + "DATA_START\n".length;
        const endIndex = content.indexOf("\nDATA_END");

        if (startIndex === -1 || endIndex === -1) {
          throw new Error('找不到有效的系統數據標籤！');
        }

        const base64Data = content.substring(startIndex, endIndex).trim();
        const jsonString = decodeURIComponent(atob(base64Data));
        const importedSongs = JSON.parse(jsonString);

        if (Array.isArray(importedSongs)) {
          if (confirm(`成功讀取 TXT 數據！是否覆蓋目前的 ${songs.length} 首歌曲資料？`)) {
            songs = importedSongs;
            recalculateAllActualRanks();
            saveSongs();
            updateSongTable();
            updateWeekSelectOptions();
            renderCurrentTab();
            alert('資料導入成功！');
          }
        } else {
          throw new Error('數據格式不正確！');
        }
      } catch (err) {
        alert('導入失敗：' + err.message);
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }
</script>
