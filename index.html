<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>歌曲編輯 - 進榜週自動計算</title>
  <style>
    .form-container {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: Arial, sans-serif;
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .input-row button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .input-row button:hover {
      background-color: #0056b3;
    }
    .readonly-input {
      background-color: #e9ecef;
      cursor: not-allowed;
    }
    small {
      color: #6c757d;
      margin-top: 4px;
      font-size: 12px;
    }
    .effective-box {
      margin-top: 15px;
      padding: 10px;
      background-color: #e8f4f8;
      border-left: 4px solid #17a2b8;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h3>歌曲進榜週設定</h3>

  <!-- 1. 發行/派台日期 -->
  <div class="form-group">
    <label for="releaseDate">發行/派台日期：</label>
    <input type="date" id="releaseDate" onchange="autoCalculateChartWeek()">
  </div>

  <!-- 2. 預計進榜週 (自動計算，可手動 Open Override) -->
  <div class="form-group">
    <label for="estimatedChartWeek">預計進榜週：</label>
    <div class="input-row">
      <input type="text" id="estimatedChartWeek" class="readonly-input" readonly placeholder="例如：2026-W38" oninput="updateEffectiveWeek()">
      <button type="button" onclick="enableOverride('estimatedChartWeek')">Open Override (手動修改)</button>
    </div>
    <small>選擇日期後自動計算，點擊按鈕可解除鎖定手動修改。</small>
  </div>

  <!-- 3. 實際進榜週 (預設為預計+1週，如有輸入則以此為準) -->
  <div class="form-group">
    <label for="actualChartWeek">實際進榜週：</label>
    <div class="input-row">
      <input type="text" id="actualChartWeek" placeholder="例如：2026-W39" oninput="onActualChartWeekInput()">
    </div>
    <small>預設為「預計進榜週 + 1週」。如有手動輸入，系統將優先以實際進榜週計算。</small>
  </div>

  <!-- 4. 顯示最終採計進榜週 -->
  <div class="effective-box">
    最終採計進榜週：<span id="effectiveWeekDisplay">未計算</span>
  </div>
</div>

<script>
  // 記錄是否已手動覆蓋
  let isEstimatedOverridden = false;
  let isActualOverridden = false;

  // 1. 選擇日期後自動計算
  function autoCalculateChartWeek() {
    const dateInput = document.getElementById('releaseDate').value;
    if (!dateInput) return;

    const date = new Date(dateInput);

    // 未手動 Override 預計進榜週時，自動計算 ISO 週數
    if (!isEstimatedOverridden) {
      const estWeekStr = getISOWeekString(date);
      document.getElementById('estimatedChartWeek').value = estWeekStr;
    }

    // 未手動 Override 實際進榜週時，預設為「預計進榜週 + 1週」
    if (!isActualOverridden) {
      const nextWeekDate = new Date(date);
      nextWeekDate.setDate(nextWeekDate.getDate() + 7); // 加 7 天 (+1 週)
      const actWeekStr = getISOWeekString(nextWeekDate);
      document.getElementById('actualChartWeek').value = actWeekStr;
    }

    updateEffectiveWeek();
  }

  // 2. 解除唯讀 (Open Override) 手動修改預計進榜週
  function enableOverride(fieldId) {
    const input = document.getElementById(fieldId);
    input.removeAttribute('readonly');
    input.classList.remove('readonly-input');
    input.focus();
    
    if (fieldId === 'estimatedChartWeek') {
      isEstimatedOverridden = true;
    }
  }

  // 3. 監聽實際進榜週的手動輸入
  function onActualChartWeekInput() {
    const val = document.getElementById('actualChartWeek').value.trim();
    if (val !== '') {
      isActualOverridden = true; // 標記為已手動輸入
    } else {
      isActualOverridden = false; // 清空時恢復自動推算
      autoCalculateChartWeek();
    }
    updateEffectiveWeek();
  }

  // 4. 計算並更新最終採計進榜週 (優先採用「實際進榜週」)
  function updateEffectiveWeek() {
    const actual = document.getElementById('actualChartWeek').value.trim();
    const estimated = document.getElementById('estimatedChartWeek').value.trim();

    // 如果有輸入實際進榜週，按實際開始計；否則按預計進榜週計
    const effectiveWeek = actual !== '' ? actual : estimated;
    
    document.getElementById('effectiveWeekDisplay').innerText = effectiveWeek || '未計算';
  }

  // 輔助函數：計算 ISO 8601 週數格式 (例如 "2026-W38")
  function getISOWeekString(d) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    // 設定至最近的週四 (週四所在的年份即為 ISO 年份)
    date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    const formattedWeek = weekNo < 10 ? '0' + weekNo : weekNo;
    return `${date.getUTCFullYear()}-W${formattedWeek}`;
  }
</script>

</body>
</html>
